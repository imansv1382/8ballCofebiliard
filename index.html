<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قرعه کشی</title>

<style>

* {
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: Arial, Tahoma, sans-serif;
    text-align: center;
    margin: 0;
    padding-top: 40px;
    user-select: none;
}

.box {
    width: 90%;
    max-width: 450px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin-bottom: 10px;
}

#message {
    font-size: 18px;
    margin-bottom: 20px;
}

#number {
    font-size: 120px;
    font-weight: bold;
    height: 160px;
    line-height: 160px;
    transition: transform 0.25s ease, opacity 0.25s ease;
}

.number-show {
    animation: numberShow 0.35s ease;
}

@keyframes numberShow {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    70% {
        transform: scale(1.1);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.draw {
    background: #16a34a;
    color: white;
}

.confirm {
    background: #f59e0b;
    color: white;
}

.confirm:disabled,
.draw:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
}

/* دکمه نگه داشتنی */

.hold-button {
    color: white;
    touch-action: none;
}

.hold-button .progress {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 0%;
    opacity: 0.35;
    transition: width 0.05s linear;
    pointer-events: none;
}

.hold-button .button-text {
    position: relative;
    z-index: 2;
}

/* نمایش همه */

.all {
    background: #2563eb;
}

.all .progress {
    background: #60a5fa;
}

/* ریست */

.reset {
    background: #dc2626;
}

.reset .progress {
    background: #f87171;
}


/* افکت موفقیت */

.success-animation {
    animation: success 0.5s ease;
}

@keyframes success {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}


/* لیست نتایج */

#result {
    margin-top: 25px;
    font-size: 20px;
    line-height: 2;
    text-align: right;
}

.person {
    background: #222;
    padding: 8px 15px;
    margin: 5px 0;
    border-radius: 8px;
    animation: itemShow 0.3s ease;
}

@keyframes itemShow {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

</style>

</head>


<body>


<div class="box">

<h1>🎲 قرعه کشی</h1>

<p id="message">
نوبت نفر اول است
</p>


<div id="number"></div>


<button
class="draw"
id="drawButton"
onclick="drawNumber()">

نمایش عدد

</button>


<button
class="confirm"
id="confirmButton"
onclick="confirmNumber()"
disabled>

متوجه شدم

</button>


<!-- نمایش همه -->

<button
class="hold-button all"
id="showAllButton">

<div class="progress"></div>

<span class="button-text">
برای نمایش همه، ۳ ثانیه نگه دارید
</span>

</button>


<!-- ریست -->

<button
class="hold-button reset"
id="resetButton">

<div class="progress"></div>

<span class="button-text">
برای ریست، ۳ ثانیه نگه دارید
</span>

</button>


<div id="result"></div>


</div>



<script>


/* =========================
   متغیرهای بازی
========================= */

var numbers = [2, 3, 4, 5, 6, 7];

var selectedNumbers = [];

var currentNumber = null;

var personNumber = 1;


/* =========================
   انتخاب عدد
========================= */

function drawNumber() {

    if (currentNumber !== null) {
        return;
    }

    if (numbers.length === 0) {

        document.getElementById("message").innerHTML =
        "همه ۶ نفر عدد خود را دریافت کرده‌اند.";

        document.getElementById("drawButton").disabled = true;

        return;
    }

    var random =
    Math.floor(Math.random() * numbers.length);

    currentNumber =
    numbers[random];

    numbers.splice(random, 1);

    selectedNumbers.push({
        person: personNumber,
        number: currentNumber
    });

    var numberBox =
    document.getElementById("number");

    numberBox.innerHTML =
    currentNumber;

    numberBox.classList.remove("number-show");

    void numberBox.offsetWidth;

    numberBox.classList.add("number-show");

    document.getElementById("message").innerHTML =
    "نفر " + personNumber + " — عدد شما";

    document.getElementById("drawButton").disabled =
    true;

    document.getElementById("confirmButton").disabled =
    false;
}


/* =========================
   تایید عدد
========================= */

function confirmNumber() {

    if (currentNumber === null) {
        return;
    }

    var numberBox =
    document.getElementById("number");

    numberBox.style.opacity = "0";

    setTimeout(function() {

        numberBox.innerHTML = "";
        numberBox.style.opacity = "1";

    }, 250);

    currentNumber = null;

    personNumber++;

    document.getElementById("confirmButton").disabled =
    true;

    if (numbers.length > 0) {

        document.getElementById("drawButton").disabled =
        false;

        document.getElementById("message").innerHTML =
        "نوبت نفر " + personNumber + " است";

    } else {

        document.getElementById("drawButton").disabled =
        true;

        document.getElementById("message").innerHTML =
        "همه افراد عدد خود را دریافت کرده‌اند.";

    }
}


/* =========================
   نمایش همه افراد
========================= */

function showAllNumbers() {

    var result =
    document.getElementById("result");

    if (selectedNumbers.length === 0) {

        result.innerHTML =
        "هنوز هیچ عددی انتخاب نشده است.";

        return;
    }

    var html =
    "<h3>نتیجه قرعه‌کشی</h3>";

    for (
        var i = 0;
        i < selectedNumbers.length;
        i++
    ) {

        html +=
        "<div class='person'>" +
        "نفر " +
        selectedNumbers[i].person +
        " : " +
        selectedNumbers[i].number +
        "</div>";
    }

    result.innerHTML = html;
}


/* =========================
   ریست
========================= */

function resetGame() {

    numbers =
    [2, 3, 4, 5, 6, 7];

    selectedNumbers = [];

    currentNumber = null;

    personNumber = 1;

    document.getElementById("number").innerHTML =
    "";

    document.getElementById("number").style.opacity =
    "1";

    document.getElementById("result").innerHTML =
    "";

    document.getElementById("message").innerHTML =
    "نوبت نفر اول است";

    document.getElementById("drawButton").disabled =
    false;

    document.getElementById("confirmButton").disabled =
    true;
}


/* ==================================================
   سیستم نگه داشتن ۳ ثانیه‌ای دکمه‌ها
================================================== */

function createHoldButton(buttonId, action) {

    var button =
    document.getElementById(buttonId);

    var progress =
    button.querySelector(".progress");

    var timer = null;

    var startTime = 0;

    var holding = false;

    var duration = 3000;


    function startHold(event) {

        event.preventDefault();

        if (holding) {
            return;
        }

        holding = true;

        startTime = Date.now();

        progress.style.width = "0%";

        button.classList.remove("success-animation");

        timer = setInterval(function() {

            var elapsed =
            Date.now() - startTime;

            var percent =
            Math.min(
                (elapsed / duration) * 100,
                100
            );

            progress.style.width =
            percent + "%";


            if (elapsed >= duration) {

                clearInterval(timer);

                timer = null;

                holding = false;

                progress.style.width = "100%";

                button.classList.add(
                    "success-animation"
                );

                action();

                setTimeout(function() {

                    progress.style.width = "0%";

                }, 250);

            }

        }, 20);
    }


    function cancelHold() {

        if (!holding) {
            return;
        }

        holding = false;

        clearInterval(timer);

        timer = null;

        progress.style.width = "0%";
    }


    /* موبایل */

    button.addEventListener(
        "touchstart",
        startHold,
        { passive: false }
    );

    button.addEventListener(
        "touchend",
        cancelHold
    );

    button.addEventListener(
        "touchcancel",
        cancelHold
    );


    /* کامپیوتر */

    button.addEventListener(
        "mousedown",
        startHold
    );

    button.addEventListener(
        "mouseup",
        cancelHold
    );

    button.addEventListener(
        "mouseleave",
        cancelHold
    );

}


/* ایجاد دکمه‌ها */

createHoldButton(
    "showAllButton",
    showAllNumbers
);


createHoldButton(
    "resetButton",
    resetGame
);


</script>

</body>

</html>
